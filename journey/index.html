<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sujay Kumar | Journey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <script src="/js/site-data.js" defer></script>
    <script src="/js/main.js" defer></script>
</head>
<body data-page="journey">
    <div class="page-shell">
        <header class="site-header" data-site-header></header>

        <main class="page-main">
            <section class="subpage-hero panel reveal">
                <p class="eyebrow" data-page-eyebrow></p>
                <h1 data-page-title></h1>
                <p class="lead" data-page-summary></p>
            </section>

            <section class="subpage-grid reveal" data-page-panels></section>

            <section class="section-block reveal">
                <div class="section-heading">
                    <p class="eyebrow">Experience timeline</p>
                    <h2>Roles, systems, and measurable outcomes.</h2>
                    <p class="supporting-copy">
                        Each role increased the scope of ownership, from backend delivery and storage abstractions to
                        Kubernetes-native platforms and enterprise service mesh reliability.
                    </p>
                </div>
                <div class="timeline-grid" data-experience-list data-variant="timeline"></div>
            </section>
        </main>

        <footer class="site-footer" data-site-footer></footer>
    </div>
</body>
</html>
