<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sujay Kumar | Connect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <script src="/js/site-data.js" defer></script>
    <script src="/js/main.js" defer></script>
</head>
<body data-page="connect">
    <div class="page-shell">
        <header class="site-header" data-site-header></header>

        <main class="page-main">
            <section class="subpage-hero panel reveal">
                <p class="eyebrow" data-page-eyebrow></p>
                <h1 data-page-title></h1>
                <p class="lead" data-page-summary></p>
                <div class="cta-row" data-contact-hero-actions></div>
            </section>

            <section class="contact-grid reveal">
                <article class="info-panel panel">
                    <p class="panel-label">Direct channel</p>
                    <h3 class="contact-address" data-contact-email></h3>
                    <p data-contact-note></p>
                    <div class="cta-row">
                        <a class="button button-primary" data-email-link>Compose email</a>
                        <button class="button button-secondary" type="button" data-copy-email>Copy email</button>
                    </div>
                    <p class="copy-feedback" data-copy-status aria-live="polite"></p>
                </article>

                <article class="info-panel panel">
                    <p class="panel-label">Availability</p>
                    <h3 data-contact-availability-title></h3>
                    <p data-contact-availability-summary></p>
                    <ul class="bullet-list" data-contact-availability-list></ul>
                </article>
            </section>

            <section class="section-block reveal">
                <div class="section-heading">
                    <p class="eyebrow">Quick paths</p>
                    <h2>Use whichever route fits your workflow.</h2>
                    <p class="supporting-copy">
                        Email is the fastest path, but the hosted resume and profile links are designed to make
                        verification frictionless.
                    </p>
                </div>
                <div class="contact-card-grid" data-contact-cards></div>
            </section>

            <section class="section-block reveal">
                <div class="section-heading">
                    <p class="eyebrow">Profiles</p>
                    <h2>Additional signal for deeper review.</h2>
                </div>
                <div class="profile-chip-grid" data-profile-links></div>
            </section>
        </main>

        <footer class="site-footer" data-site-footer></footer>
    </div>
</body>
</html>
