# The hub at https://projects.sujaykumar.dev/ — the catch-all. priority: 1 keeps
# it below every project's route (e.g. airlift's /airlift at priority 100), so a
# project path always wins and everything else lands on the hub. TLS from the
# default TLSStore (no secret referenced).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: projects-hub
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`projects.sujaykumar.dev`) && PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: projects-hub
          port: 80
  tls: {}
