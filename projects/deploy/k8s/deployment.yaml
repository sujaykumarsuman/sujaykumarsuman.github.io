apiVersion: apps/v1
kind: Deployment
metadata:
  name: projects-hub
  labels:
    app: projects-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: projects-hub
  template:
    metadata:
      labels:
        app: projects-hub
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # Unprivileged nginx: runs as uid 101 and listens on 8080.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: html
          configMap:
            name: projects-hub-index   # created by deploy.sh from ../../index.html
        - name: tmp
          emptyDir: {}
