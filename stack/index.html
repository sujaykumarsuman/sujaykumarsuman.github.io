<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sujay Kumar | Stack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Space+Grotesk:wght@400;500;700&amp;display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/main.css">
    <script src="/js/site-data.js" defer></script>
    <script src="/js/main.js" defer></script>
</head>
<body data-page="stack">
    <div class="page-shell">
        <header class="site-header" data-site-header></header>

        <main class="page-main">
            <section class="subpage-hero panel reveal">
                <p class="eyebrow" data-page-eyebrow></p>
                <h1 data-page-title></h1>
                <p class="lead" data-page-summary></p>
            </section>

            <section class="subpage-grid reveal">
                <article class="info-panel panel">
                    <p class="panel-label">Locked in now</p>
                    <ul class="bullet-list" data-page-locked></ul>
                </article>
                <article class="info-panel panel">
                    <p class="panel-label">Phase 2 adds</p>
                    <ul class="bullet-list" data-page-next></ul>
                </article>
            </section>

            <section class="section-block reveal">
                <div class="section-heading">
                    <p class="eyebrow">Grouped stack view</p>
                    <h2>The information hierarchy is visible before the final content pass.</h2>
                </div>
                <article class="panel stack-panel">
                    <div class="skill-group-grid" data-skill-groups data-groups-limit="6" data-tags-limit="6"></div>
                </article>
            </section>
        </main>

        <footer class="site-footer" data-site-footer></footer>
    </div>
</body>
</html>
